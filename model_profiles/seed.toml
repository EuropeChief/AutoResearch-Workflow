# W3 Seed 轨迹配置。保留用户确认的 Coding Plan 模型别名，不换成文档中的快照 ID。
# PCA：服务商文档中 Seed 2.1 Turbo 的 xhigh/max 映射为 high，故保留最高有效 high。
# https://docs.volcengine.com/docs/ark/deep-thinking （2026-09-30 核对）
# max_output_tokens 仅用于预留上下文空间，不会写入 Codex 配置或设置服务端上限。
schema_version = 1
model = "doubao-seed-2.1-turbo"
reasoning_effort = "high"
base_url = "https://ark.cn-beijing.volces.com/api/coding/v3"
context_window = 262144
auto_compact_token_limit = 160000
max_output_tokens = 65536

[auth_ref]
kind = "api_key_json"
path = "/data4/czm/AutoResearch/auth.json"
key = "OPENAI_API_KEY"
